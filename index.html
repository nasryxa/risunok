<!DOCTYPE html>
<head>
    <link href="pic.css" rel="stylesheet">
</head>
<body>
    <div class="pic-frame">
        <div class="pic">
            <div class="rings-up"></div>
            <div class="rings-right"></div>
            <div class="rings-left"></div>
            <div class="window">
            <div class="sun"></div>
        </div>

        <div class="teapot">
            <div class="teapot-top"></div>
            <div class="teapot-cap"></div>
            <div class="teapot-nose"></div>
            <div class="teapot-handle"></div>
            <div class="teapot-body"></div>
        </div>
        <div class="table">
            <div class="table-countertop"></div>
            <div class="table-foot"></div>
            <div class="table-bottom"></div>
        </div>
        <div class="chair chair-left">
            <div class="chair-back"></div>
            <div class="chair-sit"></div>
            <div class="chair-leg"></div>
            <div class="chair-pattern"></div>
        </div>
        <div class="chair chair-right">
            <div class="chair-back"></div>
            <div class="chair-sit"></div>
            <div class="chair-leg"></div>
            <div class="chair-pattern"></div>
        </div>

        </div>

    </div>

</body>
